name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          out="$(gofmt -l backend)"
          if [ -n "$out" ]; then
            echo "These files are not gofmt-clean:"; echo "$out"; exit 1
          fi

      - name: Vet
        run: go -C backend vet ./...

      - name: Test
        run: go -C backend test ./...

      - name: Build (static linux/amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C backend build ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm install (not ci): a transitive dep (@bomb.sh/tab) requests a
        # commander version that npm dedupes inconsistently, which trips npm ci's
        # strict lock check. npm install reconciles and builds fine.
        run: npm install --no-audit --no-fund

      - name: Build static SPA
        run: npm run generate
